<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Desk Scanner</title>
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#111;color:#eee;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  header{padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:#1b1b1b;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}
  .brand{display:flex;align-items:baseline;gap:8px;min-width:0}
  h1{font-size:17px;margin:0;font-weight:650}
  .ver{font-size:11px;color:#9adbc4;background:#0d3d30;border-radius:999px;padding:2px 8px;font-weight:650;letter-spacing:.02em;flex-shrink:0}
  .stage{position:relative;flex:1;min-height:0;background:#000}
  video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
  #overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #review{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#1a1a1a;cursor:pointer}
  body.reviewing #review{display:flex}
  #review canvas{max-width:100%;max-height:100%;background:#fff}
  #originalCanvas{display:none}
  #review.show-original #processedCanvas{display:none}
  #review.show-original #originalCanvas{display:block;background:#222}
  .review-hint{position:absolute;left:12px;right:12px;top:10px;text-align:center;font-size:13px;color:#ddd;text-shadow:0 1px 3px #000;pointer-events:none}
  .bar{flex-shrink:0;padding:10px 12px max(12px,env(safe-area-inset-bottom));background:#161616}
  .status{font-size:13px;color:#bbb;min-height:18px;margin-bottom:8px}
  .row{display:flex;flex-wrap:wrap;gap:8px}
  .capture-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  button,select{font:inherit}
  button{border:0;border-radius:10px;padding:10px 14px;background:#333;color:white;cursor:pointer}
  button.primary{background:#087f5b;font-weight:650}
  button.picture{background:#1c6dd0;font-weight:650}
  button.danger{background:#8b3030}
  button:disabled{opacity:.45;cursor:not-allowed}
  .capture-row button{padding:15px 12px;font-size:16px}
  .ghost{background:#2a2a2a}
  canvas.hidden{display:none}
  #pdfSheet{position:fixed;inset:0;background:#111;z-index:30;display:none;flex-direction:column;padding-top:max(8px,env(safe-area-inset-top))}
  #pdfSheet.open{display:flex}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:#1b1b1b}
  .sheet-head h2{margin:0;font-size:17px}
  .sheet-list{flex:1;overflow:auto;padding:10px 12px max(12px,env(safe-area-inset-bottom))}
  .page-row{display:flex;align-items:center;gap:10px;background:#1b1b1b;border-radius:12px;padding:8px;margin-bottom:8px}
  .page-row img{width:64px;height:88px;object-fit:cover;background:#fff;border-radius:6px;flex-shrink:0}
  .page-meta{flex:1;min-width:0}
  .page-meta b{display:block;font-size:14px}
  .page-meta span{font-size:12px;color:#aaa}
  .page-actions{display:flex;gap:6px}
  .page-actions button{padding:8px 10px}
  .empty{color:#888;padding:24px 8px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Desk Scanner</h1>
    <span id="appVersion" class="ver"><!--APP_VERSION-->v1<!--/APP_VERSION--></span>
  </div>
  <div class="row">
    <button id="start" class="primary">Start camera</button>
    <button id="stop" class="ghost" disabled>Stop</button>
  </div>
</header>

<div class="stage" id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="review">
    <canvas id="processedCanvas"></canvas>
    <canvas id="originalCanvas"></canvas>
    <div class="review-hint" id="reviewHint">Processed · tap to see original</div>
  </div>
</div>

<div class="bar">
  <div id="status" class="status">Press Start camera. Document mode whitens the page and sharpens text. Picture mode keeps a vivid photo.</div>
  <div id="liveBar">
    <div class="capture-row">
      <button id="captureDoc" class="primary" disabled>Document</button>
      <button id="capturePic" class="picture" disabled>Picture</button>
    </div>
    <div id="pdfLiveRow" class="row" style="margin-top:8px;display:none">
      <button id="savePdf" class="primary" disabled>Save PDF (1)</button>
      <button id="viewPdf" class="ghost" disabled>Pages</button>
    </div>
  </div>
  <div id="reviewBar" style="display:none">
    <div class="row">
      <button id="retake" class="ghost">Retake</button>
      <button id="addPage" class="primary">Add to PDF</button>
      <button id="savePdfReview" class="primary">Save PDF (1)</button>
      <button id="saveJpeg" class="ghost">Save JPEG</button>
      <button id="viewPdfReview" class="ghost">Pages</button>
    </div>
  </div>
</div>

<div id="pdfSheet">
  <div class="sheet-head">
    <h2 id="sheetTitle">PDF pages</h2>
    <div class="row">
      <button id="savePdfSheet" class="primary">Save PDF</button>
      <button id="closeSheet" class="ghost">Close</button>
    </div>
  </div>
  <div class="sheet-list" id="sheetList"></div>
</div>

<canvas id="sourceCanvas" class="hidden"></canvas>
<canvas id="detectCanvas" class="hidden"></canvas>

<script src="https://docs.opencv.org/4.x/opencv.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const video=$('video'), overlay=$('overlay'), source=$('sourceCanvas');
const processed=$('processedCanvas'), original=$('originalCanvas'), detectCanvas=$('detectCanvas');
const DEVICE_KEY='deskScanner.deviceId';
let stream=null, cvReady=false, captured=null, pages=[];
let corners=null, liveCorners=null, detectTimer=0, detectBusy=false;
let captureMode='document', reviewing=false, showingOriginal=false, currentJpeg=null;

function status(t){$('status').textContent=t}

function waitForCV(){
  if(typeof cv!=='undefined' && cv.Mat){
    cvReady=true;
    if(stream && !reviewing) startDetectLoop();
    else if(!stream) status('OpenCV is ready. Start the camera when you are ready.');
  } else setTimeout(waitForCV,150);
}
waitForCV();

function isRearCamera(label){
  return /back|rear|environment|facing back/i.test(label||'');
}
function isSecondaryLens(label){
  return /ultra|telephoto|\btele\b|depth|macro|tof|infrared|ir camera/i.test(label||'');
}

async function unlockCameraPermission(){
  const tmp=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  tmp.getTracks().forEach(t=>t.stop());
}

async function listCandidateCameras(){
  const devices=await navigator.mediaDevices.enumerateDevices();
  const videos=devices.filter(d=>d.kind==='videoinput');
  const rear=videos.filter(d=>isRearCamera(d.label));
  const pool=rear.length?rear:videos;
  const main=pool.filter(d=>!isSecondaryLens(d.label));
  return main.length?main:pool;
}

async function openCamera(deviceId){
  const videoConstraints={
    width:{ideal:7680},
    height:{ideal:4320}
  };
  if(deviceId) videoConstraints.deviceId={exact:deviceId};
  else videoConstraints.facingMode={ideal:'environment'};
  const s=await navigator.mediaDevices.getUserMedia({video:videoConstraints,audio:false});
  const track=s.getVideoTracks()[0];
  await maximizeTrack(track);
  return s;
}

async function maximizeTrack(track){
  const caps=track.getCapabilities?track.getCapabilities():{};
  const cons={};
  if(caps.width&&caps.width.max) cons.width={ideal:caps.width.max};
  if(caps.height&&caps.height.max) cons.height={ideal:caps.height.max};
  if(caps.resizeMode&&caps.resizeMode.includes('none')) cons.resizeMode='none';
  if(caps.focusMode&&caps.focusMode.includes('continuous')) cons.focusMode='continuous';
  if(Object.keys(cons).length){
    try{await track.applyConstraints(cons);}catch(e){}
  }
}

function trackPixels(track){
  const caps=track.getCapabilities?track.getCapabilities():{};
  const settings=track.getSettings();
  const w=caps.width&&caps.width.max?caps.width.max:(settings.width||0);
  const h=caps.height&&caps.height.max?caps.height.max:(settings.height||0);
  return w*h;
}

async function pickHighestResStream(candidates){
  const cached=localStorage.getItem(DEVICE_KEY);
  if(cached&&candidates.some(d=>d.deviceId===cached)){
    try{return await openCamera(cached);}catch(e){localStorage.removeItem(DEVICE_KEY);}
  }
  if(candidates.length<=1){
    const s=await openCamera(candidates[0]?candidates[0].deviceId:null);
    const id=s.getVideoTracks()[0].getSettings().deviceId;
    if(id) localStorage.setItem(DEVICE_KEY,id);
    return s;
  }
  let best=null, bestPixels=-1, bestId=null;
  for(const dev of candidates){
    try{
      const s=await openCamera(dev.deviceId);
      const pixels=trackPixels(s.getVideoTracks()[0]);
      if(pixels>=bestPixels){
        if(best) best.getTracks().forEach(t=>t.stop());
        best=s; bestPixels=pixels; bestId=dev.deviceId;
      }else s.getTracks().forEach(t=>t.stop());
    }catch(e){}
  }
  if(!best) return openCamera(null);
  if(bestId) localStorage.setItem(DEVICE_KEY,bestId);
  return best;
}

function setCaptureEnabled(on){
  $('captureDoc').disabled=!on;
  $('capturePic').disabled=!on;
}

async function startCamera(){
  if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    status('Camera access requires HTTPS. Open the published web address (https://...), not the HTML file from Drive.');
    return;
  }
  try{
    status('Requesting the highest-resolution rear camera…');
    await unlockCameraPermission();
    await new Promise(r=>setTimeout(r,150));
    const candidates=await listCandidateCameras();
    if(candidates.length>1) status('Comparing rear cameras to pick the highest resolution…');
    stream=await pickHighestResStream(candidates);
    video.srcObject=stream;
    await video.play().catch(()=>{});
    const settings=stream.getVideoTracks()[0].getSettings();
    const label=stream.getVideoTracks()[0].label||'rear camera';
    $('start').disabled=true;$('stop').disabled=false;
    setCaptureEnabled(true);
    status((settings.width&&settings.height)
      ? `${label}: ${settings.width}×${settings.height}. Document or Picture — the page outline appears automatically.`
      : 'Camera started. Capture as Document or Picture.');
    if(!reviewing) startDetectLoop();
  }catch(e){status('Camera error: '+e.message+'. Camera access requires HTTPS or localhost.')}
}
function stopCamera(){
  stopDetectLoop();
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=null;video.srcObject=null;liveCorners=null;
  $('start').disabled=false;$('stop').disabled=true;
  setCaptureEnabled(false);
  overlay.getContext('2d').clearRect(0,0,overlay.width,overlay.height);
}
$('start').onclick=startCamera;$('stop').onclick=stopCamera;

function startDetectLoop(){
  stopDetectLoop();
  const tick=()=>{
    runLiveDetect();
    detectTimer=setTimeout(tick,180);
  };
  detectTimer=setTimeout(tick,60);
}
function stopDetectLoop(){
  clearTimeout(detectTimer);
  detectTimer=0;
}

function runLiveDetect(){
  if(detectBusy||!cvReady||!stream||!video.videoWidth||reviewing) return;
  detectBusy=true;
  try{
    const p=detectFromVideo();
    liveCorners=p;
    drawOverlay(p);
  }catch(e){
  }finally{
    detectBusy=false;
  }
}

function detectFromVideo(){
  const maxW=480;
  const scale=Math.min(1, maxW/video.videoWidth);
  detectCanvas.width=Math.max(1,Math.round(video.videoWidth*scale));
  detectCanvas.height=Math.max(1,Math.round(video.videoHeight*scale));
  detectCanvas.getContext('2d',{willReadFrequently:true}).drawImage(video,0,0,detectCanvas.width,detectCanvas.height);
  const mat=cv.imread(detectCanvas);
  const p=detectPage(mat,false);
  mat.delete();
  if(!p) return null;
  return p.map(pt=>({x:pt.x/scale,y:pt.y/scale}));
}

async function grabCaptureBitmap(){
  const track=stream&&stream.getVideoTracks()[0];
  if(track && 'ImageCapture' in window){
    try{
      const ic=new ImageCapture(track);
      let opts;
      try{
        const caps=await ic.getPhotoCapabilities();
        if(caps.imageWidth&&caps.imageWidth.max&&caps.imageHeight&&caps.imageHeight.max){
          opts={imageWidth:caps.imageWidth.max,imageHeight:caps.imageHeight.max};
        }
      }catch(e){}
      let blob;
      try{blob=await ic.takePhoto(opts);}catch(e){blob=await ic.takePhoto();}
      return await createImageBitmap(blob);
    }catch(e){}
  }
  return await createImageBitmap(video);
}

function enterReview(){
  reviewing=true;
  showingOriginal=false;
  $('review').classList.remove('show-original');
  document.body.classList.add('reviewing');
  $('liveBar').style.display='none';
  $('reviewBar').style.display='block';
  $('reviewHint').textContent='Processing…';
  stopDetectLoop();
  updatePdfUi();
}

function leaveReview(){
  reviewing=false;
  showingOriginal=false;
  captured=null;
  currentJpeg=null;
  $('review').classList.remove('show-original');
  document.body.classList.remove('reviewing');
  $('liveBar').style.display='';
  $('reviewBar').style.display='none';
  if(stream) startDetectLoop();
  updatePdfUi();
}

async function captureFrame(mode){
  if(!video.videoWidth)return;
  captureMode=mode;
  enterReview();
  status(mode==='document' ? 'Capturing document…' : 'Capturing picture…');
  try{
    const bmp=await grabCaptureBitmap();
    source.width=bmp.width;source.height=bmp.height;
    source.getContext('2d').drawImage(bmp,0,0);
    if(bmp.close) bmp.close();
  }catch(e){
    source.width=video.videoWidth;source.height=video.videoHeight;
    source.getContext('2d').drawImage(video,0,0);
  }
  captured=source;
  processPage();
}
$('captureDoc').onclick=()=>captureFrame('document');
$('capturePic').onclick=()=>captureFrame('picture');

function orderPts(p){
  p=[...p];
  const sum=p.map(x=>x.x+x.y), diff=p.map(x=>x.x-x.y);
  const tl=p[sum.indexOf(Math.min(...sum))], br=p[sum.indexOf(Math.max(...sum))];
  const tr=p[diff.indexOf(Math.max(...diff))], bl=p[diff.indexOf(Math.min(...diff))];
  return [tl,tr,br,bl];
}
function polygonArea(pts){
  let s=0;
  for(let i=0;i<pts.length;i++){
    const j=(i+1)%pts.length;
    s+=pts[i].x*pts[j].y-pts[j].x*pts[i].y;
  }
  return Math.abs(s)/2;
}
function scoreQuad(pts,imageArea){
  const area=polygonArea(pts);
  if(area<imageArea*.08) return 0;
  let anglePenalty=0;
  for(let i=0;i<4;i++){
    const a=pts[i], b=pts[(i+1)%4], c=pts[(i+2)%4];
    const ux=a.x-b.x, uy=a.y-b.y, vx=c.x-b.x, vy=c.y-b.y;
    const lu=Math.hypot(ux,uy), lv=Math.hypot(vx,vy);
    if(lu<1||lv<1) return 0;
    anglePenalty+=Math.abs((ux*vx+uy*vy)/(lu*lv));
  }
  if(anglePenalty>2.4) return 0;
  return area*(1-anglePenalty/4);
}
function ptsFromApprox(approx){
  const pts=[];
  for(let j=0;j<4;j++){
    const p=approx.intPtr(j,0);
    pts.push({x:p[0],y:p[1]});
  }
  return orderPts(pts);
}
function bestQuadFromEdges(edges,imageArea){
  const contours=new cv.MatVector(), hier=new cv.Mat();
  cv.findContours(edges,contours,hier,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE);
  let best=null, bestScore=0;
  for(let i=0;i<contours.size();i++){
    const c=contours.get(i);
    const hull=new cv.Mat();
    cv.convexHull(c,hull);
    const peri=cv.arcLength(hull,true);
    for(const eps of [0.02,0.03,0.05]){
      const approx=new cv.Mat();
      cv.approxPolyDP(hull,approx,eps*peri,true);
      if(approx.rows===4 && cv.isContourConvex(approx)){
        const pts=ptsFromApprox(approx);
        const sc=scoreQuad(pts,imageArea);
        if(sc>bestScore){bestScore=sc;best=pts;}
      }
      approx.delete();
    }
    c.delete();hull.delete();
  }
  contours.delete();hier.delete();
  return best;
}
function detectPage(mat,thorough){
  const imageArea=mat.cols*mat.rows;
  const gray=new cv.Mat(), blur=new cv.Mat(), edges=new cv.Mat();
  cv.cvtColor(mat,gray,cv.COLOR_RGBA2GRAY);
  cv.GaussianBlur(gray,blur,new cv.Size(5,5),0);
  cv.Canny(blur,edges,50,160);
  const ksize=thorough?5:3;
  const kernel=cv.getStructuringElement(cv.MORPH_RECT,new cv.Size(ksize,ksize));
  cv.dilate(edges,edges,kernel);
  let best=bestQuadFromEdges(edges,imageArea);
  if(!best && thorough){
    const bin=new cv.Mat();
    cv.adaptiveThreshold(blur,bin,255,cv.ADAPTIVE_THRESH_GAUSSIAN_C,cv.THRESH_BINARY,15,5);
    cv.bitwise_not(bin,bin);
    cv.dilate(bin,bin,kernel);
    best=bestQuadFromEdges(bin,imageArea);
    bin.delete();
  }
  kernel.delete();gray.delete();blur.delete();edges.delete();
  return best;
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function warp(mat,p){
  const [tl,tr,br,bl]=p;
  const w=Math.max(dist(tl,tr),dist(bl,br)), h=Math.max(dist(tl,bl),dist(tr,br));
  const W=Math.max(2,Math.round(w)), H=Math.max(2,Math.round(h));
  const src=cv.matFromArray(4,1,cv.CV_32FC2,[tl.x,tl.y,tr.x,tr.y,br.x,br.y,bl.x,bl.y]);
  const dst=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,W-1,0,W-1,H-1,0,H-1]);
  const M=cv.getPerspectiveTransform(src,dst), out=new cv.Mat();
  cv.warpPerspective(mat,out,M,new cv.Size(W,H),cv.INTER_CUBIC,cv.BORDER_REPLICATE);
  src.delete();dst.delete();M.delete();
  return out;
}

function constMat(rows,cols,type,value){
  const m=new cv.Mat(rows,cols,type);
  m.setTo(new cv.Scalar(value));
  return m;
}

function enhanceDocument(src){
  const rgb=new cv.Mat();
  cv.cvtColor(src,rgb,src.channels()===4?cv.COLOR_RGBA2RGB:cv.COLOR_GRAY2RGB);

  const lab=new cv.Mat();
  cv.cvtColor(rgb,lab,cv.COLOR_RGB2Lab);
  const planes=new cv.MatVector();
  cv.split(lab,planes);
  const L=planes.get(0), A=planes.get(1), Bch=planes.get(2);

  const k=Math.max(31,(Math.round(Math.min(src.cols,src.rows)/16)|1));
  const blur=new cv.Mat();
  cv.GaussianBlur(L,blur,new cv.Size(k,k),0);

  const Lf=new cv.Mat(), bf=new cv.Mat();
  L.convertTo(Lf,cv.CV_32F);
  blur.convertTo(bf,cv.CV_32F);
  const eps=constMat(bf.rows,bf.cols,cv.CV_32FC1,12);
  cv.add(bf,eps,bf);
  cv.divide(Lf,bf,Lf);
  const scale=constMat(Lf.rows,Lf.cols,cv.CV_32FC1,220);
  cv.multiply(Lf,scale,Lf);
  const Lflat=new cv.Mat();
  Lf.convertTo(Lflat,cv.CV_8U);

  const clahe=new cv.CLAHE(3.0,new cv.Size(8,8));
  const Leq=new cv.Mat();
  clahe.apply(Lflat,Leq);
  clahe.delete();
  Leq.convertTo(Leq,-1,1.48,12);

  const paper=new cv.Mat();
  cv.threshold(Leq,paper,212,255,cv.THRESH_BINARY);
  Leq.setTo(new cv.Scalar(255),paper);
  A.setTo(new cv.Scalar(128),paper);
  Bch.setTo(new cv.Scalar(128),paper);
  A.convertTo(A,-1,1.2,-25.6);
  Bch.convertTo(Bch,-1,1.2,-25.6);

  const merged=new cv.Mat(), outPlanes=new cv.MatVector();
  outPlanes.push_back(Leq);outPlanes.push_back(A);outPlanes.push_back(Bch);
  cv.merge(outPlanes,merged);
  const color=new cv.Mat();
  cv.cvtColor(merged,color,cv.COLOR_Lab2RGB);

  const g=new cv.Mat(), sharp=new cv.Mat();
  cv.GaussianBlur(color,g,new cv.Size(0,0),0.9);
  cv.addWeighted(color,2.15,g,-1.15,0,sharp);
  const rgba=new cv.Mat();
  cv.cvtColor(sharp,rgba,cv.COLOR_RGB2RGBA);

  rgb.delete();lab.delete();planes.delete();L.delete();A.delete();Bch.delete();
  blur.delete();Lf.delete();bf.delete();eps.delete();scale.delete();Lflat.delete();
  Leq.delete();paper.delete();merged.delete();outPlanes.delete();color.delete();g.delete();sharp.delete();
  return rgba;
}

function enhancePicture(src){
  let out=src.clone();
  out.convertTo(out,-1,1.12,6);
  const blur=new cv.Mat(), sharp=new cv.Mat();
  cv.GaussianBlur(out,blur,new cv.Size(0,0),1.0);
  cv.addWeighted(out,1.55,blur,-0.55,0,sharp);
  out.delete();blur.delete();
  return sharp;
}

function matToCanvas(mat,canvas){
  cv.imshow(canvas,mat);
  const max=5000;
  if(canvas.width>max||canvas.height>max){
    const scale=max/Math.max(canvas.width,canvas.height);
    const tmp=document.createElement('canvas');tmp.width=Math.round(canvas.width*scale);tmp.height=Math.round(canvas.height*scale);
    tmp.getContext('2d').drawImage(canvas,0,0,tmp.width,tmp.height);
    canvas.width=tmp.width;canvas.height=tmp.height;canvas.getContext('2d').drawImage(tmp,0,0);
  }
}
function scaleLiveCorners(mat){
  if(!liveCorners||!video.videoWidth) return null;
  const sx=mat.cols/video.videoWidth, sy=mat.rows/video.videoHeight;
  return liveCorners.map(pt=>({x:pt.x*sx,y:pt.y*sy}));
}
function detectOnCapture(mat){
  const maxDetect=1200;
  let detectMat=mat, ds=1;
  if(mat.cols>maxDetect){
    ds=maxDetect/mat.cols;
    detectMat=new cv.Mat();
    cv.resize(mat,detectMat,new cv.Size(Math.round(mat.cols*ds),Math.round(mat.rows*ds)),0,0,cv.INTER_AREA);
  }
  let p=detectPage(detectMat,true);
  if(detectMat!==mat) detectMat.delete();
  if(p && ds!==1) p=p.map(pt=>({x:pt.x/ds,y:pt.y/ds}));
  return p;
}
function processPage(){
  if(!captured)return;
  if(!cvReady){
    status('Waiting for OpenCV…');
    setTimeout(processPage,150);
    return;
  }
  status(captureMode==='document'
    ? 'Flattening the page, whitening the background, and sharpening text…'
    : 'Correcting perspective and enhancing the photo…');
  setTimeout(()=>{
    const mat=cv.imread(captured);
    let p=detectOnCapture(mat)||scaleLiveCorners(mat);
    if(!p && captureMode==='document'){
      p=[{x:mat.cols*.03,y:mat.rows*.03},{x:mat.cols*.97,y:mat.rows*.03},
         {x:mat.cols*.97,y:mat.rows*.97},{x:mat.cols*.03,y:mat.rows*.97}];
    }
    corners=p;
    let w=p?warp(mat,p):mat.clone();
    const maxSide=2400;
    const long=Math.max(w.cols,w.rows);
    if(long>maxSide){
      const s=maxSide/long;
      const resized=new cv.Mat();
      cv.resize(w,resized,new cv.Size(Math.round(w.cols*s),Math.round(w.rows*s)),0,0,cv.INTER_AREA);
      w.delete();w=resized;
    }
    matToCanvas(w,original);
    const e=captureMode==='document'?enhanceDocument(w):enhancePicture(w);
    matToCanvas(e,processed);
    currentJpeg=processed.toDataURL('image/jpeg',.94);
    showingOriginal=false;
    $('review').classList.remove('show-original');
    $('reviewHint').textContent='Processed · tap to see original';
    w.delete();e.delete();mat.delete();
    status(captureMode==='document'
      ? 'Document ready. Tap the image to compare with the original.'
      : 'Picture ready. Tap the image to compare with the original.');
    updatePdfUi();
  },20);
}

function videoLayout(){
  const cam=$('stage').getBoundingClientRect();
  const vW=video.videoWidth, vH=video.videoHeight;
  if(!vW||!cam.width) return null;
  const scale=Math.min(cam.width/vW, cam.height/vH);
  return {
    offX:(cam.width-vW*scale)/2,
    offY:(cam.height-vH*scale)/2,
    scale,
    boxW:cam.width,
    boxH:cam.height
  };
}
function drawOverlay(p){
  if(reviewing) return;
  const layout=videoLayout();
  if(!layout) return;
  overlay.width=layout.boxW*devicePixelRatio;overlay.height=layout.boxH*devicePixelRatio;
  overlay.style.width=layout.boxW+'px';overlay.style.height=layout.boxH+'px';
  const c=overlay.getContext('2d');
  c.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  c.clearRect(0,0,layout.boxW,layout.boxH);
  if(!p)return;
  c.beginPath();
  p.forEach((q,i)=>{
    const x=q.x*layout.scale+layout.offX, y=q.y*layout.scale+layout.offY;
    i?c.lineTo(x,y):c.moveTo(x,y);
  });
  c.closePath();
  c.fillStyle='rgba(0,255,157,.16)';
  c.fill();
  c.lineWidth=3;c.strokeStyle='#00ff9d';c.stroke();
}

$('review').onclick=()=>{
  if(!processed.width) return;
  showingOriginal=!showingOriginal;
  $('review').classList.toggle('show-original',showingOriginal);
  $('reviewHint').textContent=showingOriginal
    ? 'Original · tap to see processed'
    : 'Processed · tap to see original';
};

$('retake').onclick=()=>{
  leaveReview();
  status(stream?'Ready for another capture.':'Start the camera to capture another page.');
};

function pendingExportList(){
  const out=pages.slice();
  if(reviewing && currentJpeg) out.push(currentJpeg);
  return out;
}
function pdfCount(){
  return pages.length+(reviewing&&currentJpeg?1:0);
}
function updatePdfUi(){
  const n=pdfCount();
  const label='Save PDF ('+n+')';
  ['savePdf','savePdfReview','savePdfSheet'].forEach(id=>{
    const b=$(id);
    b.textContent=label;
    b.disabled=n===0;
  });
  const pagesLabel=pages.length?('Pages ('+pages.length+')'):'Pages';
  $('viewPdf').textContent=pagesLabel;
  $('viewPdfReview').textContent=pagesLabel;
  $('viewPdf').disabled=n===0;
  $('viewPdfReview').disabled=n===0;
  $('pdfLiveRow').style.display=pages.length?'flex':'none';
  $('sheetTitle').textContent=n?('PDF pages ('+n+')'):'PDF pages';
}

function addCurrentPage(){
  if(!currentJpeg)return;
  pages.push(currentJpeg);
  leaveReview();
  status('Added to PDF ('+pages.length+' page'+(pages.length>1?'s':'')+'). Capture the next page, or save the PDF.');
  updatePdfUi();
}
$('addPage').onclick=addCurrentPage;

function saveJPEG(){
  if(!processed.width)return;
  const a=document.createElement('a');
  a.href=processed.toDataURL('image/jpeg',0.95);
  a.download=(captureMode==='document'?'scanned-document-':'scanned-photo-')+new Date().toISOString().replace(/[:.]/g,'-')+'.jpg';
  document.body.appendChild(a); a.click(); a.remove();
}
$('saveJpeg').onclick=saveJPEG;

async function savePDF(){
  const list=pendingExportList();
  if(!list.length)return;
  const {jsPDF}=window.jspdf;
  const first=new Image();first.src=list[0];await first.decode();
  const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  for(let i=0;i<list.length;i++){
    if(i)pdf.addPage(undefined,'a4');
    const im=i?new Image():first;
    if(i){im.src=list[i];await im.decode();}
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight(), margin=5;
    const scale=Math.min((pw-2*margin)/im.width,(ph-2*margin)/im.height);
    const w=im.width*scale,h=im.height*scale;
    pdf.addImage(im,'JPEG',(pw-w)/2,(ph-h)/2,w,h,'','FAST');
  }
  pdf.save('scanned-document.pdf');
  status('Saved PDF ('+list.length+' page'+(list.length>1?'s':'')+').');
}
$('savePdf').onclick=savePDF;
$('savePdfReview').onclick=savePDF;
$('savePdfSheet').onclick=savePDF;

function renderPdfSheet(){
  const list=$('sheetList');
  list.innerHTML='';
  const items=pages.map((src,i)=>({src,index:i,pending:false}));
  if(reviewing && currentJpeg) items.push({src:currentJpeg,index:-1,pending:true});
  if(!items.length){
    list.innerHTML='<div class="empty">No pages yet. Capture a document and tap Add to PDF, or Save PDF for a single page.</div>';
    return;
  }
  items.forEach((item,pos)=>{
    const row=document.createElement('div');
    row.className='page-row';
    const img=document.createElement('img');
    img.src=item.src;
    const meta=document.createElement('div');
    meta.className='page-meta';
    meta.innerHTML='<b>Page '+(pos+1)+'</b><span>'+(item.pending?'Current capture (not added yet)':'In PDF')+'</span>';
    const actions=document.createElement('div');
    actions.className='page-actions';
    if(!item.pending){
      const up=document.createElement('button');up.className='ghost';up.textContent='↑';up.disabled=item.index===0;
      up.onclick=()=>{if(item.index>0){[pages[item.index-1],pages[item.index]]=[pages[item.index],pages[item.index-1]];renderPdfSheet();updatePdfUi();}};
      const down=document.createElement('button');down.className='ghost';down.textContent='↓';down.disabled=item.index===pages.length-1;
      down.onclick=()=>{if(item.index<pages.length-1){[pages[item.index+1],pages[item.index]]=[pages[item.index],pages[item.index+1]];renderPdfSheet();updatePdfUi();}};
      actions.append(up,down);
    }
    const del=document.createElement('button');del.className='danger';del.textContent='Delete';
    del.onclick=()=>{
      if(item.pending){
        leaveReview();
        status('Current capture discarded.');
        renderPdfSheet();
        return;
      }
      pages.splice(item.index,1);
      updatePdfUi();
      renderPdfSheet();
    };
    actions.append(del);
    row.append(img,meta,actions);
    list.appendChild(row);
  });
}
function openPdfSheet(){
  renderPdfSheet();
  $('pdfSheet').classList.add('open');
}
function closePdfSheet(){$('pdfSheet').classList.remove('open')}
$('viewPdf').onclick=openPdfSheet;
$('viewPdfReview').onclick=openPdfSheet;
$('closeSheet').onclick=closePdfSheet;

updatePdfUi();
window.addEventListener('resize',()=>{if(video.videoWidth && !reviewing)drawOverlay(liveCorners||corners)});
</script>

<script>
if ('serviceWorker' in navigator && window.isSecureContext) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
